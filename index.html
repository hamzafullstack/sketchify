<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sketchify</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
   <h1>Sketchify</h1>

<div class="controls">
    <p>Choose your grid size:</p>
    <div class="toggle-group">
        <label class="toggle-item">
            <input type="radio" name="grid-size" value="16" checked>
            <span>16x16</span>
        </label>

        <label class="toggle-item">
            <input type="radio" name="grid-size" value="32">
            <span>32x32</span>
        </label>

        <label class="toggle-item">
            <input type="radio" name="grid-size" value="64">
            <span>64x64</span>
        </label>
    </div>
</div>
